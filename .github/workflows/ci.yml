# CI: a mesma verificação completa que o scripts/ship.sh corre localmente, em várias versões do macOS.
# O resultado no commit de cada tag é um dos critérios para a versão passar a estável (scripts/stable.py).
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verificação completa (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # O Prune suporta macOS 14 ou mais recente. Os executores do GitHub são Apple silicon;
        # o binário Intel é compilado e verificado (lipo), mas não executado aqui.
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode mais recente do executor
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          sw_vers
          xcodebuild -version
          swift --version

      - name: ./scripts/check.sh --full
        run: ./scripts/check.sh --full

      - name: Registos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registos-${{ matrix.os }}
          path: .build/check-*.log
          if-no-files-found: ignore
          retention-days: 14
