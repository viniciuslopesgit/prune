# CI: the same full check scripts/ship.sh runs locally, on several macOS versions.
# The result on each tag's commit is one of the criteria for a version to become stable (scripts/stable.py).
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Prune supports macOS 14 or later. GitHub's runners are Apple silicon;
        # the Intel binary is built and checked (lipo), but not run here.
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Runner's latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          sw_vers
          xcodebuild -version
          swift --version

      - name: ./scripts/check.sh --full
        run: ./scripts/check.sh --full

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: .build/check-*.log
          include-hidden-files: true   # .build is a hidden folder
          if-no-files-found: ignore
          retention-days: 14
